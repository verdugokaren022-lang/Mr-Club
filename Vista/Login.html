<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <title>CLUB ADSO</title>
         <link rel="stylesheet" href="../assets/CSS/Estilos.css">
    </head>

    <body>
        <div class="container-login">
            <h2>Iniciar Sesión Accerías</h2>

            <form id="FormuLogin" action="" method="POST">
                <div class="grupo-input">
                    <label for="Email">Correo Electrónico: </label>
                    <input type="email" id="Email" required placeholder="Ingresa Tu Correo Electrónico">
                </div>

                <div class="grupo-input">
                    <label for="Password">Contraseña: </label>
                    <input type="password" id="Password" required placeholder="Ingresa Tu Contraseña">
                </div>
                <div class="grupo-botones">
                    <button type="submit">Ingresar</button>
                    <button type="reset" class="btn-secundario">Cancelar</button>
                </div>

                <p class="texto-link">
                    ¿No tienes una cuenta? <a href="Registro.html">Regístrate aquí</a>
                </p>
            </form>
        </div>
    </body>
</html>
