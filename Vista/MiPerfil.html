<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | MR CLUB</title>
    <style>
        :root {
            --navy: #c0a6cf;
            --gold: #d22ce1;
            --cream: #f6f3ec;
            --white: #ffffff;
            --text: #58386d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background: var(--cream);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 6%;
            color: var(--white);
            background: var(--navy);
        }

        .brand {
            color: var(--white);
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-decoration: none;
        }

        .brand span {
            color: var(--gold);
        }

        main {
            width: min(900px, 88%);
            margin: 48px auto;
        }

        h1 {
            margin-top: 0;
            color: var(--navy);
        }

        #mensaje {
            margin-bottom: 16px;
            padding: 10px 14px;
            border-radius: 6px;
            font-weight: 600;
        }

        #mensaje:empty {
            display: none;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .alert-danger {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .profile-card {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 32px;
            padding: 32px;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(11, 29, 51, 0.08);
        }

        .avatar {
            display: grid;
            place-items: center;
            width: 180px;
            height: 180px;
            margin: auto;
            border: 6px solid var(--cream);
            border-radius: 50%;
            color: var(--navy);
            background: var(--gold);
            font-size: 4rem;
            font-weight: 700;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: var(--navy);
            font-size: 0.9rem;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ccd3da;
            border-radius: 6px;
            font: inherit;
        }

        input[readonly] {
            background-color: #f3f4f6;
            color: #555;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
        }

        button,
        a.secondary {
            padding: 11px 18px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .primary {
            color: var(--navy);
            background: var(--gold);
        }

        .secondary {
            color: var(--navy);
            background: #e8edf2;
        }

        @media (max-width: 680px) {
            .profile-card {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column-reverse;
            }

            button,
            a.secondary {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header>
        <a class="brand" href="dashboard.html" aria-label="MR CLUB - Inicio"><span>MR</span> CLUB</a>
        <span>Mi cuenta</span>
    </header>

    <main>
        <h1>Mi Perfil</h1>
        <div id="mensaje" role="alert"></div>

        <form id="formPerfil" class="profile-card">
            <div id="avatarInicial" class="avatar" aria-label="Inicial del usuario">M</div>

            <div>
                <div class="field">
                    <label for="documento">Documento</label>
                    <input id="documento" name="documento" type="text" readonly>
                </div>

                <div class="field">
                    <label for="nombres">Nombres</label>
                    <input id="nombres" name="nombres" type="text" required>
                </div>

                <div class="field">
                    <label for="apellidos">Apellidos</label>
                    <input id="apellidos" name="apellidos" type="text" required>
                </div>

                <div class="field">
                    <label for="email">Correo electrónico</label>
                    <input id="email" name="email" type="email" required>
                </div>

                <div class="actions">
                    <a class="secondary" href="dashboard.html">Volver Al Panel</a>
                    <button class="primary" type="submit">Guardar cambios</button>
                </div>
            </div>
        </form>
    </main>

    <script src="../Controlador/MiPerfil.js"></script>
</body>

</html>
