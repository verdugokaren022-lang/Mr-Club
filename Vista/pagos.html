<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>CLUB ACERIAS - Registro de Pagos</title>
    <style>
        .header-mr {
            background-color: #be21b1;
            border-bottom: 1px solid #e41ab1;
            padding: 20px 3px;
        }
    </style>
</head>

<body class="bg-light">

    <!-- Barra Superior -->
    <div class="header-mr d-flex justify-content-between align-items-center px-4 text-white">
        <h3>CLUB ACERIAS - Gestión de Pagos</h3>
        <a href="dashboard.html" class="btn btn-light btn-sm">
            <i class="bi bi-arrow-left"></i> Volver al Panel
        </a>
    </div>

    <!-- Contenedor del Formulario -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow p-4">
                    <h4 class="text-primary mb-4"><i class="bi bi-wallet2"></i> Registrar Pago Mensual</h4>
                    
                    <form>
                        <!-- Código o ID del Préstamo -->
                        <div class="mb-3">
                            <label for="codigoPrestamo" class="form-label">Código del Préstamo</label>
                            <input type="text" class="form-control" id="codigoPrestamo" required placeholder="Número o código del préstamo a abonar">
                        </div>

                        <div class="row">
                            <!-- Valor de la cuota pagada -->
                            <div class="col-md-6 mb-3">
                                <label for="valorCuota" class="form-label">Valor de la Cuota</label>
                                <input type="number" class="form-control" id="valorCuota" required placeholder="Ej. 250000">
                            </div>
                            <!-- Fecha en la que se realizó el pago -->
                            <div class="col-md-6 mb-3">
                                <label for="fechaPago" class="form-label">Fecha del Pago</label>
                                <input type="date" class="form-control" id="fechaPago" required>
                            </div>
                        </div>

                        <!-- Botones -->
                        <div class="d-flex justify-content-end gap-2 mt-3">
                            <button type="reset" class="btn btn-secondary">Limpiar</button>
                            <button type="submit" class="btn btn-primary">Guardar Pago</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
