<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actividades del club</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <style>
      .navbar-custom {
        background-color: #1c2841;
      }
      .btn-action {
        padding: 0.2rem 0.45rem;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body class="bg-white">
    <!-- Barra superior -->
    <header class="navbar-custom text-white py-3 px-4 mb-4">
      <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="h4 mb-0 fw-semibold">Actividades del club</h1>
        <a href="panel.html" class="btn btn-outline-light btn-sm px-3">
          <i class="bi bi-arrow-left me-1"></i> Volver al panel
        </a>
      </div>
    </header>

    <!-- Contenido principal centrado -->
    <main class="container" style="max-width: 960px;">
      <div class="d-flex justify-content-between align-items-center mb-3 mt-4">
        <p class="mb-0 text-muted">
          Consulta las actividades programadas y su información.
        </p>
        <button
          id="nuevaActividad"
          class="btn btn-success btn-sm px-3 py-2"
          type="button"
          data-bs-toggle="modal"
          data-bs-target="#modalActividad"
        >
          <i class="bi bi-plus-lg me-1"></i> Nueva actividad
        </button>
      </div>

      <!-- TABLA -->
      <div class="card shadow-sm overflow-hidden">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th scope="col" class="py-3 px-3">Actividad</th>
                <th scope="col" class="py-3 px-3">Fecha</th>
                <th scope="col" class="py-3 px-3">Municipio</th>
                <th scope="col" class="py-3 px-3">Total recaudado</th>
                <th id="encabezadoAcciones" scope="col" class="py-3 px-3 text-center">
                  Acciones
                </th>
              </tr>
            </thead>
            <tbody id="listaActividades">
              <!-- Fila 1 -->
              <tr>
                <td class="py-3 px-3">Actividad prueba</td>
                <td class="py-3 px-3">2000-12-14</td>
                <td class="py-3 px-3">Duitama</td>
                <td class="py-3 px-3">$ 1.600.000</td>
                <td class="py-3 px-3 text-center">
                  <button
                    type="button"
                    class="btn btn-outline-primary btn-action me-1"
                    title="Editar"
                  >
                    <i class="bi bi-pencil-square"></i>
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-danger btn-action"
                    title="Eliminar"
                  >
                    <i class="bi bi-trash"></i>
                  </button>
                </td>
              </tr>
              <!-- Fila 2 -->
              <tr>
                <td class="py-3 px-3">Actividad prueba2</td>
                <td class="py-3 px-3">2027-12-12</td>
                <td class="py-3 px-3">sogamoso</td>
                <td class="py-3 px-3">Pendiente</td>
                <td class="py-3 px-3 text-center">
                  <button
                    type="button"
                    class="btn btn-outline-primary btn-action me-1"
                    title="Editar"
                  >
                    <i class="bi bi-pencil-square"></i>
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-danger btn-action"
                    title="Eliminar"
                  >
                    <i class="bi bi-trash"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- CONTENEDOR DE TOASTS -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div
        id="toastNotificacion"
        class="toast align-items-center border-0"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="d-flex">
          <div class="toast-body" id="mensajeToast"></div>
          <button
            type="button"
            class="btn-close me-2 m-auto"
            data-bs-dismiss="toast"
            aria-label="Cerrar"
          ></button>
        </div>
      </div>
    </div>

    <!-- MODAL ACTIVIDAD -->
    <div
      class="modal fade"
      id="modalActividad"
      tabindex="-1"
      aria-labelledby="tituloModalActividad"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="formActividad">
            <div class="modal-header">
              <h2 class="modal-title fs-5" id="tituloModalActividad">
                Nueva actividad
              </h2>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Cerrar"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="idActividad" />

              <div class="mb-3">
                <label for="nombreActividad" class="form-label">
                  Nombre de la actividad
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="nombreActividad"
                  maxlength="100"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="fecha" class="form-label">Fecha</label>
                <input
                  type="date"
                  class="form-control"
                  id="fecha"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="municipio" class="form-label">Municipio</label>
                <input
                  type="text"
                  class="form-control"
                  id="municipio"
                  maxlength="50"
                  required
                />
              </div>

              <div id="campoTotalRecaudado" class="mb-3">
                <label for="totalRecaudado" class="form-label">
                  Total recaudado (opcional; completar al finalizar)
                </label>
                <input
                  type="number"
                  class="form-control"
                  id="totalRecaudado"
                  min="0"
                  step="0.01"
                  placeholder="Ej.: 1500000.00"
                />
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary" id="btnGuardar">
                Guardar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Controladores/Actividades.js"></script>
  </body>
</html>
