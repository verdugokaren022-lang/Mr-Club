<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>CLUB ACERIAS - Registro de Asociados</title>
    <style>
        .header-mr {
            background-color: #be21a9;
            border-bottom: 1px solid #e41a97;
            padding: 20px 3px;
        }
    </style>
</head>

<body class="bg-light">

    <div class="header-mr d-flex justify-content-between align-items-center px-4 text-white">
        <h3>CLUB ACERIAS - Gestión de Asociados</h3>
        <a href="dashboard.html" class="btn btn-light btn-sm">
            <i class="bi bi-arrow-left"></i> Volver al Panel
        </a>
    </div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow p-4">
                    <h4 class="text-primary mb-4"><i class="bi bi-person-plus"></i> Registrar Nuevo Asociado</h4>
                    
                    <form>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="documento" class="form-label">Documento (Cédula)</label>
                                <input type="text" class="form-control" id="documento" required placeholder="Número de documento">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="nombres" class="form-label">Nombres</label>
                                <input type="text" class="form-control" id="nombres" required placeholder="Nombres completos">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="apellidos" class="form-label">Apellidos</label>
                                <input type="text" class="form-control" id="apellidos" required placeholder="Apellidos completos">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
                                <input type="date" class="form-control" id="fechaNacimiento" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="direccion" class="form-label">Dirección de Residencia (Ej. Sogamoso, Paipa)</label>
                            <input type="text" class="form-control" id="direccion" required placeholder="Dirección y ciudad">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" id="telefono" required placeholder="Número de contacto">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email" required placeholder="correo@gmail.com">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-3">
                            <button type="reset" class="btn btn-secondary">Limpiar</button>
                            <button type="submit" class="btn btn-primary">Guardar Asociado</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
